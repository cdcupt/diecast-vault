name: DiecastVault
options:
  bundleIdPrefix: com.daichenlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

# Languages the String Catalog (Localizable.xcstrings) ships — Xcode writes the
# matching CFBundleLocalizations so the zh-Hans build is selectable. (Base is the
# Interface-Builder/strings fallback region.)
knownRegions:
  - en
  - zh-Hans
  - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "76Y6W629GC"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Simulator/dev builds don't need a signing identity; the device archive
    # (Release) must sign with an Apple Distribution cert + App Store profile,
    # provisioned on demand via -allowProvisioningUpdates + the ASC API key.
    Debug:
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_ALLOWED: YES

# Local Swift package: the pure, UI-free domain + design tokens, linked as a
# real SPM dependency (no local-copy drift, per TECH.html).
packages:
  DiecastVaultCore:
    path: DiecastVaultCore

targets:
  DiecastVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DiecastVaultCore
        product: DiecastVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daichenlab.diecastvault
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Diecast Vault"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light   # warm light chrome only
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Spike-0 on-device capture (ObjectCaptureSession) needs camera access; the
        # purpose string is required or the first camera request hard-crashes.
        INFOPLIST_KEY_NSCameraUsageDescription: "Diecast Vault uses the camera to scan your diecast cars into 3D models."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Standard HTTPS only → exempt from export-compliance; declaring it here
        # skips the per-upload "missing compliance" prompt in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  # UI test proving the runtime language switch flips the whole app live.
  DiecastVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DiecastVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daichenlab.diecastvault.uitests
        GENERATE_INFOPLIST_FILE: YES
