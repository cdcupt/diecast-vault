name: DiecastVault
options:
  bundleIdPrefix: com.daichenlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

# Languages the String Catalog (Localizable.xcstrings) ships — Xcode writes the
# matching CFBundleLocalizations so the zh-Hans build is selectable. (Base is the
# Interface-Builder/strings fallback region.)
knownRegions:
  - en
  - zh-Hans
  - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Local Swift package: the pure, UI-free domain + design tokens, linked as a
# real SPM dependency (no local-copy drift, per TECH.html).
packages:
  DiecastVaultCore:
    path: DiecastVaultCore

targets:
  DiecastVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DiecastVaultCore
        product: DiecastVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daichenlab.diecastvault
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Diecast Vault"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light   # warm light chrome only
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # UI test proving the runtime language switch flips the whole app live.
  DiecastVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DiecastVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daichenlab.diecastvault.uitests
        GENERATE_INFOPLIST_FILE: YES
